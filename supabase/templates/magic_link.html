<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your PlanPal sign-in code</title>
  </head>
  <body style="margin:0; padding:0; background-color:#FAF8F4;">
    <!-- Preheader: shown in the inbox preview, hidden in the body -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      Your PlanPal sign-in code is {{ .Token }}. Expires shortly, single use.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF8F4;">
      <tr>
        <td align="center" style="padding:40px 16px; font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:400px;">

            <tr>
              <td style="background-color:#FFFFFF; border:1px solid #ECE6DE; border-radius:20px; padding:36px 32px; text-align:center;">

                <h1 style="margin:0 0 8px; font-family:Georgia,serif; font-size:22px; color:#29211B;">
                  Sign in to PlanPal
                </h1>

                <p style="margin:0 0 28px; font-size:14px; line-height:1.5; color:#A39A90;">
                  Enter this code to finish signing in.
                </p>

                <div style="background-color:#FAF8F4; border:1px solid #ECE6DE; border-radius:14px; padding:20px 12px; font-family:'SFMono-Regular',Consolas,Menlo,monospace; font-size:30px; font-weight:bold; letter-spacing:9px; color:#29211B; padding-left:21px;">{{ .Token }}</div>

              </td>
            </tr>

            <tr>
              <td style="padding:20px 8px 0; text-align:center; font-size:12px; color:#A39A90;">
                Expires shortly, single use. If you didn't request this, ignore this email.
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
