name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    env:
      E2E_USER: e2e@test.local
      E2E_TEST_LOGIN_SECRET: local-e2e-secret-do-not-use-in-prod
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts a local Supabase stack (Postgres + Auth + API) inside Docker on
      # the runner. Migrations in supabase/migrations/ are applied automatically.
      # This is entirely local — no production project, secrets, or data are
      # ever touched by CI.
      - name: Start local Supabase
        run: supabase start

      - name: Get local Supabase credentials
        id: supabase
        run: |
          set -euo pipefail
          STATUS=$(supabase status -o env)
          ANON=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          SERVICE=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
          echo "anon=$ANON"       >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service }}

      # No manual user-seeding step needed: POST /api/test/login (gated by
      # E2E_TEST_LOGIN_SECRET, see src/app/api/test/login/route.ts) creates the
      # e2e user on first sign-in via the Auth admin API, same as a real
      # magic-link signup would, just without sending an email.
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
